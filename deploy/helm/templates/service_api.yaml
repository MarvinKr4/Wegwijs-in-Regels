apiVersion: v1
kind: Service
metadata:
  name: {{ include "wegwijs.fullname" . }}-api
  labels:
    {{- include "wegwijs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: api
